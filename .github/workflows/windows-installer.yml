name: Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-installer:
    name: Build and verify installer
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select current stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Read package version
        id: version
        shell: pwsh
        env:
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'xyra' } | Select-Object -First 1
          if ($null -eq $package) {
            throw 'Could not find the xyra package in cargo metadata.'
          }
          $version = $package.version
          $numericVersion = ($version -split '-', 2)[0]
          if ($env:BUILD_REF_TYPE -eq 'tag' -and $env:BUILD_REF_NAME -ne "v$version") {
            throw "Release tag '$env:BUILD_REF_NAME' must match Cargo.toml version 'v$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric-version=$numericVersion" >> $env:GITHUB_OUTPUT

      - name: Test and lint
        shell: pwsh
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build release application
        shell: pwsh
        run: cargo build --release --locked

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          XYRA_VERSION: ${{ steps.version.outputs.version }}
          XYRA_NUMERIC_VERSION: ${{ steps.version.outputs.numeric-version }}
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw 'Inno Setup compiler (ISCC.exe) was not found after installation.'
          }
          & $iscc "/DMyAppVersion=$env:XYRA_VERSION" "/DMyAppNumericVersion=$env:XYRA_NUMERIC_VERSION" "installer\xyra.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Smoke-test install and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter 'Xyra-Setup-*-x64.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Xyra installer, but found $($installers.Count)."
          }
          $installer = $installers[0]
          $installDirectory = Join-Path $env:RUNNER_TEMP 'XyraInstallerSmoke'
          $install = Start-Process -FilePath $installer.FullName -WindowStyle Hidden -Wait -PassThru -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installDirectory"
          )
          if ($install.ExitCode -ne 0) {
            throw "Installer smoke test failed with exit code $($install.ExitCode)."
          }
          $installedApplication = Join-Path $installDirectory 'xyra.exe'
          if (-not (Test-Path -LiteralPath $installedApplication -PathType Leaf)) {
            throw 'The installer completed without installing xyra.exe.'
          }
          $uninstaller = Join-Path $installDirectory 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -WindowStyle Hidden -Wait -PassThru -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART'
          )
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller smoke test failed with exit code $($uninstall.ExitCode)."
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter 'Xyra-Setup-*-x64.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Xyra installer, but found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Xyra-Windows-Installer-${{ steps.version.outputs.version }}
          path: |
            dist/Xyra-Setup-*-x64.exe
            dist/Xyra-Setup-*-x64.exe.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/Xyra-Setup-*-x64.exe
            dist/Xyra-Setup-*-x64.exe.sha256
