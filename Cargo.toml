[package]
name = "xyra"
version = "0.1.0-alpha"
edition = "2024"
description = "A local-first game clipping, editing, and publishing desktop app"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35.0"
ffmpeg-sidecar = "2.5.2"
global-hotkey = "0.8.0"
open = "5.3.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.24.1"
wasapi = "0.23.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
